run_name: scout_tiny
seed: 1337
steps: 2000
batch_size: 128
lr: 0.001
device: auto

model:
  d_model: 256
  n_layers: 4
  n_heads: 4
  d_ff: 1024
  dropout: 0.0

task:
  p: 31

capture:
  every_steps: 50
  layers: [0, 3]
  embeddings: true
  residuals: true
  source: probe_fixed    # train_batch | probe_fixed | mixed

probes:
  fixed:
    enabled: true
    n_examples: 256
    seed: 123
  holdout:
    enabled: true
    n_examples: 256
    seed: 456

instrumentation:
  include_embedding: true
  layers: [0, 3]

probe_eval:
  every_steps: 25

triggers:
  enabled: true
  rules:
    - type: "probe_acc_crosses"
      threshold: 0.90
    - type: "loss_drop"
      min_drop: 0.25
      window_steps: 200
      
