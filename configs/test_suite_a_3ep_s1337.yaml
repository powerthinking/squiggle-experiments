# Test Suite A: 3 epochs, cosine schedule, seed 42
# Baseline configuration for seed invariance testing

run_name: "test_suite_a_3ep"
seed: 1337
device: "cuda:0"

model:
  size: "350m"
  vocab_size: 50257
  max_seq_len: 256

data:
  split_dir: "/home/todd/software/squiggle/data/candidate_pool/splits/split_v1_s42"

training:
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 32  # effective batch = 64
  lr: 3e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_fraction: 0.05  # 5% of total steps
  lr_schedule: cosine
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  val_every_epoch: true

scalars:
  enabled: true
  global_loss: true
  per_task_loss: true
  per_task_accuracy: true
  grad_norm_global: true
  grad_norm_per_block: false
  lr: true

checkpoints:
  enabled: true
  early_until_step: 50
  early_every_steps: 10
  late_every_steps: 20
  keep_last_n: 5
  save_optimizer: true

probes:
  fixed:
    enabled: true
    n_examples: 16
    seed: 123
  extended:
    enabled: true
    n_examples: 32
    seed: 456
    milestone_fractions: [0.1, 0.25, 0.5, 0.75, 1.0]
  metrics:
    embeddings_output: true
    residual_stream: true
    attention_stats: true
    entropy: true
    top_k_mass: true
    top_k_values: [1, 5, 10]
  layers: [0, 4, 8, 12, 16, 20, 23]
  fixed_every_steps: 10

activations:
  enabled: true
  early_until_step: 30
  early_every_steps: 10
  mid_until_step: 50
  mid_every_steps: 15
  late_every_steps: 20
  capture:
    x_in: true
    attn_out: true
    x_mid: true
    mlp_out: true
    x_out: true
  source: probe_fixed
  probe_n_examples: 16
  probe_seed: 123

attention_matrices:
  enabled: false
