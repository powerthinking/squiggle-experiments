# Example Research Training Configuration
# See squiggle_experiments/research/config.py for all options

# Run identification
run_name: "research_1b_example"
seed: 1337
device: auto  # auto | cpu | cuda | cuda:0

# Model configuration
model:
  size: "1b"  # debug | 350m | 1b
  vocab_size: 32000
  max_seq_len: 2048
  # Optional overrides (uncomment to customize):
  # d_model: 2048
  # n_layers: 24
  # n_heads: 16
  dropout: 0.0
  tie_embeddings: true

# Data configuration
data:
  dataset: "nvidia/OpenMathReasoning"
  split: "cot"
  # family_data_dir: null  # Override with local family JSONL directory
  # families: null  # List of families to include (null = all)
  max_samples: null
  shuffle_seed: 42

# Training hyperparameters
training:
  steps: 50000
  batch_size: 32
  gradient_accumulation_steps: 4
  lr: 3e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 500
  lr_schedule: cosine  # cosine | linear | constant
  min_lr_ratio: 0.1
  dtype: bf16  # fp32 | fp16 | bf16
  max_grad_norm: 1.0

# A. Scalars (every step)
scalars:
  enabled: true
  global_loss: true
  per_task_loss: true
  per_task_accuracy: true
  grad_norm_global: true
  grad_norm_per_block: false  # Enable for detailed per-layer tracking
  lr: true
  curriculum_mix: true

# B. Checkpoints (weights)
checkpoints:
  enabled: true
  early_until_step: 2000
  early_every_steps: 250
  late_every_steps: 1000
  keep_last_n: 5
  save_optimizer: true

# C. Probes (critical section)
probes:
  fixed:
    enabled: true
    n_examples: 500
    seed: 123
  extended:
    enabled: true
    n_examples: 5000
    seed: 456
    milestone_fractions: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0]
  metrics:
    embeddings_output: true
    residual_stream: true
    attention_stats: true
    entropy: true
    top_k_mass: true
    top_k_values: [1, 5, 10]
  layers: [0, 6, 12, 18, 23]
  fixed_every_steps: 100

# D. Activation checkpoints
activations:
  enabled: true
  early_until_step: 2000
  early_every_steps: 500
  mid_until_step: 10000
  mid_every_steps: 2000
  late_every_steps: 5000
  capture:
    x_in: true
    attn_out: true
    x_mid: true
    mlp_out: true
    x_out: true
  source: probe_fixed  # train_batch | probe_fixed | mixed
  probe_n_examples: 256
  probe_seed: 123

# E. Attention matrices (DEFERRED)
attention_matrices:
  enabled: false
  on_fixed_probes: true
  on_extended_milestones: true
  all_layers: true
