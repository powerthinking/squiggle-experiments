[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squiggle-experiments"
version = "0.1.0"
description = "Experiment runners, Scout/Research training configs, and artifact production for Squiggle Matching."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Todd Michaud" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "torch>=2.2",
  "tqdm>=4.66",
  "squiggle-core>=0.1.0",
  "squiggle-instrumentation>=0.1.0",
  "squiggle-analysis>=0.1.0",
]

[project.scripts]
squiggle-run = "squiggle_experiments.run_and_analyze:main"
squiggle-research = "squiggle_experiments.research.trainer:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
